<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#282a36"><title>Nightshift · Your next design role</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head>
<body>
<header><div class="header-inner"><a class="brand" href="/" aria-label="Nightshift home">nightshift</a></div></header>
<main>
<section class="board"><div class="board-head"><h1>The shortlist <span id="count">0</span></h1><button class="secondary" id="export" type="button">Export jobs ↓</button></div>
<form id="access" hidden><label>App access key <input id="key" type="password" autocomplete="current-password" required></label><button>Unlock</button></form>
<div class="filters"><label class="search"><span class="sr-only">Search roles or companies</span><input id="search" type="search" placeholder="Search roles, companies, locations…"></label><label>Status<select id="status"><option value="active">Active opportunities</option><option value="all">All statuses</option><option value="discovered">Discovered</option><option value="in progress">In progress</option><option value="applied">Applied</option><option value="interviewed">Interviewed</option><option value="offer extended">Offer extended</option><option value="rejected">Rejected</option><option value="inactive">Inactive</option><option value="ghosted">Ghosted</option></select></label><label>Platform<select id="platform"><option value="all">All platforms</option></select></label><label>Sort by<select id="sort"><option value="newest">Newest posted</option><option value="stored">Recently discovered</option><option value="company">Company A–Z</option><option value="updated">Recently updated</option></select></label><button class="secondary reset" id="reset" type="button">Reset</button></div>
<p id="notice" role="status" aria-live="polite"></p>
<div class="table-wrap" tabindex="0" aria-label="Job opportunities table"><table><thead><tr><th scope="col">Role / company</th><th scope="col">Location</th><th scope="col">Posted</th><th scope="col">Status</th><th scope="col">Source</th><th scope="col"><span class="sr-only">Job posting</span></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="empty" hidden><h2>No jobs yet</h2><p id="empty-message">New roles will appear here.</p></div>
<div class="board-foot"><span id="showing">Loading jobs…</span><span id="last-run">Waiting for first search</span></div>
</section>

</main></body></html>
